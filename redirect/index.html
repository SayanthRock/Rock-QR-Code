<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirecting...</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white h-screen flex flex-col items-center justify-center font-sans">
  <div class="text-center p-8 bg-gray-800 rounded-xl shadow-2xl border border-gray-700 max-w-sm w-full">
    <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-purple-500 mx-auto mb-6"></div>
    <h2 class="text-xl font-bold mb-2 tracking-wide text-gray-100">Establishing Secure Link</h2>
    <p class="text-gray-400 text-sm mb-6">Decoding dynamic target...</p>
    <div id="error-message" class="hidden bg-red-500/10 border border-red-500/20 text-red-400 text-xs p-3 rounded-lg mt-4 text-left">
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const urlParams = new URLSearchParams(window.location.search);
      const code = urlParams.get("code");
      const errorDiv = document.getElementById("error-message");

      if (!code) {
        showError("Invalid or missing short code.");
        return;
      }

      if (code.startsWith('local_')) {
        showError("This is an offline-forged link. It exists only on the device that created it until synchronized with a server.");
        return;
      }

      const BACKEND_URL = "https://sayanth-rock-qr-backend.vercel.app";
      const targetApi = `${BACKEND_URL}/api/resolve/${encodeURIComponent(code)}`;

      const visitorData = {
          visitorId: generateVisitorId(),
          os: getMobileOperatingSystem(),
          browser: getBrowserName(),
      };

      fetch(targetApi, {
          method: 'POST',
          headers: {
              'Content-Type': 'application/json'
          },
          body: JSON.stringify(visitorData)
      })
      .then(response => {
        if (!response.ok) {
           throw new Error(`Server returned ${response.status}: Code not found or expired.`);
        }
        return response.json();
      })
      .then(data => {
        if (data && data.url) {
           window.location.replace(data.url);
        } else {
           throw new Error("Invalid response from server.");
        }
      })
      .catch(error => {
        console.error("Resolution Error:", error);
        showError(error.message);
      });

      function showError(msg) {
        errorDiv.textContent = msg;
        errorDiv.classList.remove("hidden");
        document.querySelector('.animate-spin').classList.add("hidden");
      }

      function generateVisitorId() {
        let vid = localStorage.getItem('rock_qr_vid');
        if (!vid) {
            vid = 'v_' + Math.random().toString(36).substring(2, 15);
            localStorage.setItem('rock_qr_vid', vid);
        }
        return vid;
      }

      function getMobileOperatingSystem() {
          var userAgent = navigator.userAgent || navigator.vendor || window.opera;
          if (/windows phone/i.test(userAgent)) return "Windows Phone";
          if (/android/i.test(userAgent)) return "Android";
          if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) return "iOS";
          return "Desktop/Unknown";
      }

      function getBrowserName() {
          var userAgent = navigator.userAgent;
          if(userAgent.match(/chrome|chromium|crios/i)) return "Chrome";
          if(userAgent.match(/firefox|fxios/i)) return "Firefox";
          if(userAgent.match(/safari/i)) return "Safari";
          if(userAgent.match(/opr\//i)) return "Opera";
          if(userAgent.match(/edg/i)) return "Edge";
          return "Unknown";
      }
    });
  </script>
</body>
</html>
