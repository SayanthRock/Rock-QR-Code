<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0b1020" />
  <title>Page not found | Rock QR Code</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #070b16;
      --panel: rgba(255,255,255,0.09);
      --border: rgba(255,255,255,0.16);
      --text: #f7f8ff;
      --muted: #aeb6d2;
      --accent: #e2b884;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at top left, rgba(226,184,132,0.22), transparent 32rem),
        linear-gradient(145deg, #070b16, #10172c 55%, #070b16);
      color: var(--text);
    }

    main {
      width: min(680px, 100%);
      padding: 36px;
      border-radius: 30px;
      border: 1px solid var(--border);
      background: var(--panel);
      backdrop-filter: blur(18px);
      box-shadow: 0 24px 80px rgba(0,0,0,0.42);
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(3rem, 12vw, 7rem);
      line-height: 0.9;
      letter-spacing: -0.08em;
    }

    p {
      margin: 22px auto 0;
      max-width: 520px;
      color: var(--muted);
      line-height: 1.7;
      font-size: 1.08rem;
    }

    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 46px;
      margin-top: 28px;
      padding: 0 20px;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--accent), #ffe6bf);
      color: #141006;
      font-weight: 800;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <h1>404</h1>
    <p>
      This page is not here. Stunning development, humanity has invented another way to misplace a file.
      Use the home page below for Rock QR Code.
    </p>
    <a href="./">Go to Rock QR Code</a>
  </main>
</body>
</html>
