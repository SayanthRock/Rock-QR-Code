<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rock QR Code - Redirecting</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#030712">
  <style>
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top left, rgba(139,92,246,.22), transparent 32%), #03050a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: center;
      padding: 24px;
    }
    .card {
      width: min(420px, 100%);
      padding: 28px;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 22px;
      background: rgba(10,14,23,.72);
      box-shadow: 0 24px 80px rgba(0,0,0,.35);
      backdrop-filter: blur(18px);
    }
    h1 { margin: 0 0 10px; font-size: 22px; }
    p { margin: 0; color: #cbd5e1; line-height: 1.6; font-size: 14px; }
    a { color: #c4b5fd; font-weight: 700; }
  </style>
  <script>
    (function () {
      var repoBase = "/Rock-QR-Code/";
      var path = window.location.pathname;
      var search = window.location.search || "";
      var hash = window.location.hash || "";
      var target = repoBase;

      if (path === "/Rock-QR-Code/share" || path === "/Rock-QR-Code/share/") {
        target = repoBase + "share/";
      }

      window.location.replace(target + search + hash);
    })();
  </script>
</head>
<body>
  <main class="card">
    <h1>Redirecting to Rock QR Code</h1>
    <p>If your browser does not move automatically, open <a href="/Rock-QR-Code/">Rock QR Code</a>.</p>
  </main>
</body>
</html>
