version: 2
updates:
  # Gradle configurations & dependencies
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      androidx-stack:
        patterns:
          - "androidx.*"
      network-stack:
        patterns:
          - "com.squareup.*"
          - "com.squareup.retrofit2:*"
          - "com.squareup.okhttp3:*"
    ignore:
      # Keep Gradle pinned until the Android Gradle Plugin stack is explicitly verified.
      - dependency-name: "gradle-wrapper"
        versions:
          - ">9.4.1"
      # KSP must track the Kotlin compiler line. Kotlin is pinned to 2.2.10 here.
      - dependency-name: "com.google.devtools.ksp"
        versions:
          - ">=2.3.0"

  # GitHub Actions pipelines & workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
