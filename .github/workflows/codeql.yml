name: "CodeQL Analysis"

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  schedule:
    - cron: '23 18 * * 4' # Runs every Thursday at 18:23 UTC

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'java-kotlin' ]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        validate-wrappers: false

    - name: Validate or Regenerate Gradle Wrapper
      run: |
        echo "🔍 Checking Gradle Wrapper integrity..."
        if [ ! -f gradle/wrapper/gradle-wrapper.jar ] || ! java -jar gradle/wrapper/gradle-wrapper.jar --version > /dev/null 2>&1; then
          echo "⚠️ Corrupt or missing gradle-wrapper.jar detected! Regenerating using pre-installed system Gradle..."
          gradle wrapper --gradle-version 9.3.1
        fi
        echo "✅ Gradle Wrapper is ready. Setting execute permissions..."
        chmod +x ./gradlew

    - name: Decode or Generate Debug Keystore
      run: |
        if [ -f debug.keystore.base64 ]; then
          echo "🔑 Decoding debug.keystore.base64 to debug.keystore..."
          base64 --decode debug.keystore.base64 > debug.keystore
        else
          echo "⚠️ debug.keystore.base64 not found! Generating fresh temporary debug.keystore..."
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        fi

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        build-mode: manual

    - name: Build Project (Manual compilation for CodeQL)
      run: |
        ./gradlew assembleDebug --no-daemon

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{ matrix.language }}"
