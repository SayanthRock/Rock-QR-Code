name: Android Release + Changelog

on:
  push:
    tags:
      - "v*"
      - "V*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Gradle Properties for KSP2 Compatibility
        run: |
          echo "🔍 Checking gradle.properties for incompatible legacy options..."
          if grep -q "ksp.useKSP2.in_process=false" gradle.properties; then
            echo "❌ ERROR: Incompatible 'ksp.useKSP2.in_process=false' found in gradle.properties!"
            echo "KSP2's compiler frontend expects a standalone Kotlin compiler daemon. Setting this property to 'in-process' will cause NullPointerException crashes."
            exit 1
          fi
          
          if grep -q "ksp.useKSP2=false" gradle.properties; then
            echo "❌ ERROR: Obsolete 'ksp.useKSP2=false' found in gradle.properties!"
            echo "Legacy KSP1 is no longer supported with the updated Gradle/Kotlin version. KSP2 must be used."
            exit 1
          fi
          
          echo "✅ gradle.properties validation passed. Ready for KSP2-based compilation."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
          cache-read-only: false

      - name: Validate or Regenerate Gradle Wrapper
        run: |
          echo "🔍 Checking Gradle Wrapper integrity..."
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ] || ! java -jar gradle/wrapper/gradle-wrapper.jar --version > /dev/null 2>&1; then
            echo "⚠️ Corrupt or missing gradle-wrapper.jar detected! Regenerating using pre-installed system Gradle..."
            gradle wrapper --gradle-version 9.3.1
          fi
          echo "✅ Gradle Wrapper is ready. Setting execute permissions..."
          chmod +x ./gradlew

      - name: Decode or Generate Debug Keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            echo "🔑 Decoding debug.keystore.base64 to debug.keystore..."
            base64 --decode debug.keystore.base64 > debug.keystore
          else
            echo "⚠️ debug.keystore.base64 not found! Generating fresh temporary debug.keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

       - name: Rename Release APK for Release Assets
        run: |
          echo "🏷️ Renaming release APK for distribution..."
          mkdir -p app/build/outputs/apk/release
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/Rock_QR.apk
            echo "✅ Created Rock_QR.apk"
          else
            echo "⚠️ Could not locate app-release.apk. Looking for any generated release APK..."
            find app/build/outputs/apk/release/ -name "*.apk" -exec cp {} app/build/outputs/apk/release/Rock_QR.apk \;
          fi

      # 🧠 Generate automatic changelog from commits
      - name: Generate Automatic Changelog
        run: |
          echo "📝 Fetching full git history for accurate changelog generation..."
          git fetch --prune --unshallow || true
          
          echo "🔍 Locating previous release tag..."
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          
          if [ -n "$PREV_TAG" ]; then
            echo "📄 Previous tag found: $PREV_TAG"
            git log ${PREV_TAG}..HEAD --pretty=format:"%s (%h) by %an" > raw_commits.txt || echo "chore: Incremental package adjustments (v0.0.0) by CI" > raw_commits.txt
          else
            echo "📄 No previous tag in repository history. Extrapolating commit logs..."
            git log -n 25 --pretty=format:"%s (%h) by %an" > raw_commits.txt || echo "chore: Initial repository setup (v1.0.0) by CI" > raw_commits.txt
          fi

          # Parse and group commit entries into standardized conventional categories
          touch feats.txt fixes.txt docs.txt chores.txt others.txt
          while IFS= read -r line; do
            # Cover case-insensitivity cleanly
            lower_line=$(echo "$line" | tr '[:upper:]' '[:lower:]')
            if [[ "$lower_line" =~ ^feat || "$lower_line" =~ ^add ]]; then
              echo "- $line" >> feats.txt
            elif [[ "$lower_line" =~ ^fix ]]; then
              echo "- $line" >> fixes.txt
            elif [[ "$lower_line" =~ ^docs || "$lower_line" =~ ^readme ]]; then
              echo "- $line" >> docs.txt
            elif [[ "$lower_line" =~ ^chore || "$lower_line" =~ ^refactor || "$lower_line" =~ ^ci || "$lower_line" =~ ^test || "$lower_line" =~ ^style || "$lower_line" =~ ^perf ]]; then
              echo "- $line" >> chores.txt
            else
              echo "- $line" >> others.txt
            fi
          done < raw_commits.txt

          # Build release notes template header
          cat << 'EOF' > release_notes.md
          ### 📱 Rock QR Release

          This is a stable release of Rock QR!

          #### Key Highlights:
          - **Expressive Neon Matrix (Material 10)**: Sweeping hologram laser effects, live emission effects, and interactive mode switching.
          - **Tactile Material 3 Theme**: Fluid custom animations, high-contrast chiseled preset coordinates, and glassmorphism.
          - **Robust SQLite Room Database**: Local persistency for recent scans and generated QR codes.
          - **KSP2/Gradle-native compilation**: Fast, highly optimized builds.

          #### 📝 Structured Changelog:
          EOF
          
          # Remove leading whitespaces from templated header
          sed -i -e 's/^[[:space:]]*//' release_notes.md

          # Append grouped segments to build structured release logs
          {
            if [ -s feats.txt ]; then
              echo ""
              echo "##### 🚀 New Features & Capabilities"
              cat feats.txt
            fi
            if [ -s fixes.txt ]; then
              echo ""
              echo "##### 🐛 Bug Fixes & Resilience"
              cat fixes.txt
            fi
            if [ -s docs.txt ]; then
              echo ""
              echo "##### 📖 Documentation & Guides"
              cat docs.txt
            fi
            if [ -s chores.txt ]; then
              echo ""
              echo "##### ⚙️ Maintenance, Refactoring & CI/CD"
              cat chores.txt
            fi
            if [ -s others.txt ]; then
              echo ""
              echo "##### 📝 Other Incremental Adjustments"
              cat others.txt
            fi
          } >> release_notes.md

          # Add closing quality assurances
          cat << 'EOF' >> release_notes.md

          #### 📦 Attached Quality Artifacts:
          - **`Rock_QR.apk`**: Installable Android application package (Release-signed/Debug-signed).
          EOF

          echo "✅ Category-based structural release note compiled successfully."
          cat release_notes.md

      # 🚀 Create or Update GitHub Release
      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/Rock_QR.apk
          tag_name: ${{ github.ref_name }}
          name: Rock QR ${{ github.ref_name }}
          body_path: release_notes.md
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
