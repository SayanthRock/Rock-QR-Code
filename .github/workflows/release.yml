name: Rock QR Automatic Release

on:
  push:
    tags:
      - "v*"
      - "Rock-QR-CodeV*"
  workflow_dispatch:
    inputs:
      release_name:
        description: "Release name, for example Rock-QR-CodeV2.0.0"
        required: false
        default: "Rock-QR-CodeV2.0.0"

permissions:
  contents: write

concurrency:
  group: rock-qr-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build APK and Publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Validate Gradle Runtime
        run: gradle --version --no-daemon

      - name: Run Unit Tests
        run: gradle testDebugUnitTest --stacktrace --no-daemon

      - name: Build APK
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Prepare APK assets
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/Rock-QR-Code.apk
          cp app/build/outputs/apk/debug/app-debug.apk "release-assets/${GITHUB_REF_NAME}.apk"
          sha256sum release-assets/*.apk > release-assets/SHA256SUMS.txt

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Rock-QR-Code-APK
          path: release-assets/*
          if-no-files-found: error

      - name: Generate changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          {
            echo "CHANGELOG<<EOF"
            if [ -n "$PREV_TAG" ]; then
              git log --pretty=format:"- %s" "$PREV_TAG..HEAD"
            else
              git log --pretty=format:"- %s"
            fi
            echo ""
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Publish GitHub Release from tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body: ${{ env.CHANGELOG }}
          files: release-assets/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish manual GitHub Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ inputs.release_name }}
          tag_name: ${{ inputs.release_name }}
          body: ${{ env.CHANGELOG }}
          files: release-assets/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
