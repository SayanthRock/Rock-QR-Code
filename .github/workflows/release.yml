name: Android Release + Changelog

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and Publish Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix Gradle permissions
        run: chmod +x ./gradlew

      - name: Validate Gradle Properties
        run: |
          if grep -q "kotlin.compiler.execution.strategy=in-process" gradle.properties; then
            echo "Legacy Kotlin in-process compiler execution is not supported."
            exit 1
          fi

          if grep -q "ksp.useKSP2=false" gradle.properties; then
            echo "Legacy KSP1 mode is not supported."
            exit 1
          fi

          echo "Gradle properties look good."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
          cache-read-only: false

      - name: Validate Gradle Wrapper
        run: ./gradlew --version --no-daemon

      - name: Decode or Generate Debug Keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 --decode debug.keystore.base64 > debug.keystore
          else
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Rename Release APK for Release Assets
        run: |
          mkdir -p app/build/outputs/apk/release
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/Rock_QR.apk
            cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/Chamo_QR.apk
          else
            echo "Could not locate app-release.apk"
            find app/build/outputs/apk/release/ -name "*.apk"
            exit 1
          fi

      - name: Generate Changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          {
            echo "CHANGELOG<<EOF"
            if [ -n "$PREV_TAG" ]; then
              git log --pretty=format:"- %s" "$PREV_TAG..HEAD"
            else
              git log --pretty=format:"- %s"
            fi
            echo ""
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ env.CHANGELOG }}
          files: |
            app/build/outputs/apk/release/Rock_QR.apk
            app/build/outputs/apk/release/Chamo_QR.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
