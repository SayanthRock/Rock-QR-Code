name: Build Rock QR Code APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Restore or generate debug keystore
        run: |
          if [ -f "debug.keystore.base64" ]; then
            echo "Restoring debug.keystore from repository base64 file"
            base64 -d debug.keystore.base64 > debug.keystore
          else
            echo "debug.keystore.base64 not found, generating fallback debug keystore"
            keytool -genkeypair -v -keystore debug.keystore -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build APK (Debug)
        run: gradle assembleDebug

      - name: Build AAB (Release)
        run: gradle bundleRelease || true # Non-blocking if signing configuration is missing for bundle

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RockQRCode-debug-apk
          path: app/build/outputs/apk/debug/*-debug.apk

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: RockQRCode-release-aab
          path: app/build/outputs/bundle/release/*-release.aab
