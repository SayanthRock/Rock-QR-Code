name: Website Deploy to GitHub Pages

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    name: Build APK and Deploy PWA
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Validate or Regenerate Gradle Wrapper
        run: |
          echo "🔍 Checking Gradle Wrapper integrity..."
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ] || ! java -jar gradle/wrapper/gradle-wrapper.jar --version > /dev/null 2>&1; then
            echo "⚠️ Corrupt or missing gradle-wrapper.jar detected! Regenerating using pre-installed system Gradle..."
            gradle wrapper --gradle-version 8.7
          fi
          echo "✅ Gradle Wrapper is ready. Setting execute permissions..."
          chmod +x ./gradlew

      - name: Decode or Generate Debug Keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            echo "🔑 Decoding debug.keystore.base64 to debug.keystore..."
            base64 --decode debug.keystore.base64 > debug.keystore
          else
            echo "⚠️ debug.keystore.base64 not found! Generating fresh temporary debug.keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Android App (APK compilation)
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare Web Deployment Directory
        run: |
          mkdir -p dist
          
          # Copy core static web pages and configuration
          cp index.html manifest.json sw.js dist/
          
          # Copy web asset directories
          cp -r assets dist/ || echo "⚠️ assets directory not present"
          cp -r components dist/ || echo "⚠️ components directory not present"
          cp -r lib dist/ || echo "⚠️ lib directory not present"
          cp -r share dist/ || echo "⚠️ share directory not present"
          
          # Copy compiled brand APKs for direct downloads on Web PWA from building output
          cp app/build/outputs/apk/debug/app-debug.apk "dist/Rock_QR.apk" || echo "⚠️ debug APK could not be copied to Rock_QR.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/Rock QR.apk" || echo "⚠️ debug APK could not be copied to Rock QR.apk"
          
          echo "📂 Deployment folder structure:"
          ls -la dist/

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          clean: true
