name: Android Auto-Heal CI

on:
  push:
    branches: ["main", "master"]
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/android-autoheal-ci.yml"
  pull_request:
    branches: ["main", "master"]
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/android-autoheal-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Auto-Healing Android CI Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup trusted Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1
          cache-read-only: false

      - name: Fix Gradle permissions
        run: chmod +x gradlew || true

      - name: Print Gradle runtime
        run: |
          gradle --version
          if [ -f gradle/wrapper/gradle-wrapper.properties ]; then
            echo "Wrapper config:"
            cat gradle/wrapper/gradle-wrapper.properties
          fi

      - name: Validate Gradle Wrapper without blocking build
        run: |
          set +e
          ./gradlew --version
          WRAPPER_STATUS=$?
          set -e
          if [ "$WRAPPER_STATUS" -ne 0 ]; then
            echo "::warning::Gradle wrapper failed validation. Continuing with trusted Gradle 9.3.1 from setup-gradle."
          fi

      - name: Generate debug keystore if missing
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair \
              -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Clean & Assemble Debug Build
        run: gradle clean assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            *.apk
