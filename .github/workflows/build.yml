name: Rock QR CI

on:
  push:
    branches: ["main", "master"]
    tags:
      - "v*"
    paths:
      - "app/**"
      - ".github/workflows/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
  pull_request:
    branches: ["main", "master"]
    paths:
      - "app/**"
      - ".github/workflows/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rock-qr-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and Build Rock QR
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Gradle Properties
        run: |
          if grep -q "kotlin.compiler.execution.strategy=in-process" gradle.properties; then
            echo "Legacy Kotlin in-process compiler execution is not supported."
            exit 1
          fi

          if grep -q "ksp.useKSP2=false" gradle.properties; then
            echo "Legacy KSP1 mode is not supported."
            exit 1
          fi

          echo "Gradle properties look good."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Validate Gradle Runtime
        run: gradle --version --no-daemon

      - name: Run Unit Tests
        run: gradle testDebugUnitTest --stacktrace --no-daemon

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rock-qr-test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Rename APK for Artifact
        run: |
          mkdir -p app/build/outputs/apk/debug
          cp app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/Rock QR.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/Chamo QR.apk"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Rock-QR-Artifacts
          path: |
            app/build/outputs/apk/debug/Rock QR.apk
            app/build/outputs/apk/debug/Chamo QR.apk
            app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
