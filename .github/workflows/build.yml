name: Android CI Debug APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-apk:
    name: Validate, Test, and Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Validate Gradle Wrapper Runtime
        run: ./gradlew --version

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew clean assembleDebug --stacktrace

      - name: Collect debug APK
        id: apk
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -n 1)
          VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts | head -n 1)

          if [ -z "$VERSION_NAME" ] || [ -z "$VERSION_CODE" ]; then
            echo "Could not read app version from app/build.gradle.kts" >&2
            exit 1
          fi

          mkdir -p apk-output
          cp app/build/outputs/apk/debug/app-debug.apk "apk-output/Rock-QR-debug-v${VERSION_NAME}-${VERSION_CODE}.apk"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          ls -lh apk-output

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rock-QR-debug-v${{ steps.apk.outputs.version_name }}-${{ steps.apk.outputs.version_code }}
          path: apk-output/*.apk
          if-no-files-found: error
          retention-days: 14
