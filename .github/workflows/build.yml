name: Rock QR CI & Automated Release

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
      - 'V*'
    paths:
      - 'app/**'
      - '.github/workflows/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
  workflow_dispatch:
    inputs:
      version:
        description: "Optional release version tag, for example v1.0.51. Leave blank to build APK artifact only."
        required: false
        default: ""

jobs:
  build:
    name: Validate, Test & Package ROCK Qr
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Validate Gradle Wrapper
        run: |
          echo "Checking Gradle wrapper..."
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ] || [ ! -f gradle/wrapper/gradle-wrapper.properties ]; then
            echo "Gradle wrapper files are missing. Regenerating pinned wrapper."
            gradle wrapper --gradle-version 9.4.1
          fi
          chmod +x ./gradlew
          ./gradlew --version

      - name: Generate Debug Keystore
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace --no-daemon --no-configuration-cache

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon --no-configuration-cache

      - name: Stage APK Outputs
        run: |
          mkdir -p release_outputs
          cp app/build/outputs/apk/debug/app-debug.apk release_outputs/ROCK_Qr.apk
          cp app/build/outputs/apk/debug/app-debug.apk "release_outputs/ROCK Qr.apk"
          if [ -n "${{ github.event.inputs.version }}" ]; then
            cp app/build/outputs/apk/debug/app-debug.apk "release_outputs/ROCK_Qr_${{ github.event.inputs.version }}.apk"
          fi

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ROCK-Qr-debug-apk
          path: release_outputs/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          name: ROCK Qr ${{ github.event.inputs.version || github.ref_name }}
          files: release_outputs/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
