name: Rock QR CI

on:
  push:
    branches: ["main", "master"]
    tags:
      - "v*"
    paths:
      - "app/**"
      - ".github/workflows/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - "debug.keystore.base64"
  pull_request:
    branches: ["main", "master"]
    paths:
      - "app/**"
      - ".github/workflows/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - "debug.keystore.base64"
  workflow_dispatch:

jobs:
  build:
    name: Build and Release Rock QR APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix Gradle permissions
        run: chmod +x ./gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Decode stable debug keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            echo "Decoding committed stable debug.keystore..."
            base64 --decode debug.keystore.base64 > debug.keystore
          else
            echo "debug.keystore.base64 missing, generating temporary key. Install-over-update may fail between builds."
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Rock QR Debug,O=Sayanth Rock,C=IN"
          fi

      - name: Validate Gradle properties
        run: |
          if grep -q "kotlin.compiler.execution.strategy=in-process" gradle.properties 2>/dev/null; then
            echo "Remove kotlin.compiler.execution.strategy=in-process because it can break modern KSP builds."
            exit 1
          fi
          if grep -q "ksp.useKSP2=false" gradle.properties 2>/dev/null; then
            echo "Remove ksp.useKSP2=false because this project expects KSP2."
            exit 1
          fi
          echo "Gradle properties look safe."

      - name: Run unit tests
        id: unit-tests
        continue-on-error: true
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug and release APKs
        run: ./gradlew clean assembleDebug assembleRelease --stacktrace

      - name: Prepare APK files
        id: prepare-apk
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -n 1)
          VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts | head -n 1)
          mkdir -p release-apk

          cp app/build/outputs/apk/debug/app-debug.apk "release-apk/Rock-QR-debug-v${VERSION_NAME}-${VERSION_CODE}.apk"
          cp app/build/outputs/apk/release/app-release.apk "release-apk/Rock-QR-release-v${VERSION_NAME}-${VERSION_CODE}.apk"
          cp app/build/outputs/apk/release/app-release.apk "release-apk/Rock QR.apk"
          cp app/build/outputs/apk/release/app-release.apk "release-apk/Rock_QR.apk"

          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          ls -lh release-apk

      - name: Upload APK artifact
        id: upload-apk
        uses: actions/upload-artifact@v4
        with:
          name: Rock-QR-APK-v${{ steps.prepare-apk.outputs.version_name }}-${{ steps.prepare-apk.outputs.version_code }}
          path: release-apk/*.apk
          if-no-files-found: error

      - name: Move latest tag to this commit
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f latest "$GITHUB_SHA"
          git push origin refs/tags/latest --force

      - name: Generate release notes
        if: github.event_name != 'pull_request'
        run: |
          cat > release_notes.md <<EOF
          ### Rock QR APK

          Fresh APK build: v${{ steps.prepare-apk.outputs.version_name }} (${{ steps.prepare-apk.outputs.version_code }})

          #### Fixed in this build
          - Added Android camera permission for QR scanner access.
          - Bumped APK versionCode so phone installs detect this as a newer update.
          - Added stable GitHub Actions signing key so future APKs can install over previous APKs.
          - Added launcher icon fallback resources for better icon consistency across devices and launchers.
          - Built both debug and release APK outputs.

          #### Download
          Use `Rock QR.apk` or `Rock_QR.apk` from the release assets.
          EOF
          sed -i -e 's/^[[:space:]]*//' release_notes.md
          cat release_notes.md

      - name: Create or update GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && format('Rock QR {0}', github.ref_name) || 'Rock QR Latest APK' }}
          body_path: release_notes.md
          files: release-apk/*.apk
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Add build summary
        if: always()
        run: |
          echo "### Rock QR Build Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version: v${{ steps.prepare-apk.outputs.version_name }} (${{ steps.prepare-apk.outputs.version_code }})" >> "$GITHUB_STEP_SUMMARY"
          echo "- APK artifact: ${{ steps.upload-apk.outputs.artifact-url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Unit tests outcome: ${{ steps.unit-tests.outcome }}" >> "$GITHUB_STEP_SUMMARY"
