name: Dependency Submission

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dependency-submission:
    name: Submit Gradle Dependency Snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup trusted Gradle runtime
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
          validate-wrappers: false

      - name: Disable incomplete wrapper for this job
        run: |
          rm -f ./gradlew
          rm -f ./gradlew.bat
          rm -rf ./gradle/wrapper
          gradle --version --no-daemon

      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@v4
        with:
          gradle-version: "8.10.2"
          additional-arguments: --no-daemon --no-configuration-cache --stacktrace
          dependency-graph: generate-and-submit
          dependency-graph-continue-on-failure: true
